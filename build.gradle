plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

base.archivesName = archive_base_name
version = mod_version
group = maven_group

repositories {
    maven { url = "https://maven.shedaniel.me/" } // Cloth Config, REI
    maven { url = "https://maven.parchmentmc.org" } // Parchment Mappings
    maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu, Trinkets
    maven { url = "https://mvn.devos.one/snapshots/" } // Create, Porting Lib, Forge Tags, Milk Lib, Registrate, Hephaestus, Mantle
    maven { url = "https://maven.wispforest.io/releases/" } // Star Fluid
    maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // Forge Config API Port
    maven { url = "https://modmaven.dev" } // Flywheel
    maven { url = "https://maven.ladysnake.org/releases" } // Trinkets
    maven { url = "https://api.modrinth.com/maven" } // LazyDFU, Ad Astra, C:C&A
    maven { url = "https://repo.sleeping.town/" } // EMI
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings(loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
    })
    modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")

	// Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}")

    modImplementation("net.minecraftforge:forgeconfigapiport-fabric:${forge_config_api_port_version}")

    modImplementation("com.simibubi.create:create-fabric-${minecraft_version}:${create_version}")
    modImplementation("maven.modrinth:createaddition:${ccaa_version}")

    modImplementation("dev.emi:trinkets:${project.trinkets_version}")

    modImplementation("maven.modrinth:another-furniture:${another_furniture_version}")

    modImplementation("slimeknights.tconstruct:Hephaestus:${hephaestus_version}") {
        exclude(group: "curse.maven")
        exclude(group: "mcjty.theoneprobe")
	}
    modImplementation("slimeknights.mantle:Mantle:${mantle_version}") {
        exclude(group: "curse.maven")
	}

    modImplementation("maven.modrinth:ad-astra:${ad_astra_version}")
    modImplementation("teamreborn:energy:${teamreborn_energy_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modImplementation("me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // QoL
    modLocalRuntime("com.terraformersmc:modmenu:${modmenu_version}")
    modLocalRuntime("me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
    modLocalRuntime("dev.emi:emi:${emi_version}")
    modLocalRuntime("maven.modrinth:lazydfu:${lazydfu_version}")
}

configurations.all {
    resolutionStrategy {
        force("net.fabricmc:fabric-loader:${fabric_loader_version}")
        force("io.github.fabricators_of_create:Porting-Lib:${porting_lib_version}")
    }
}

processResources {
    // Require dependencies to be the version compiled against or newer
    Map<String, String> properties = new HashMap<>()
    properties.put("version", mod_version)
    properties.put("fabric_loader_version", fabric_loader_version)
    properties.put("fabric_api_version", fabric_api_version)
    properties.put("create_version", create_version)
    properties.put("minecraft_version", minecraft_version)

    properties.forEach((k, v) -> inputs.property(k, v))

    filesMatching("fabric.mod.json") {
        expand properties
    }
}

tasks.withType(JavaCompile).configureEach {
    // The newer versions
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
